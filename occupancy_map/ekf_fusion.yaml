### ekf_fusion.yaml ###
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_acceleration: true
    print_diagnostics: true

    map_frame: map
    odom_frame: wizard/odom
    base_link_frame: wizard/base_link
    world_frame: wizard/odom

    # OAK-D IMU Configuration
    imu0: /oak/imu/data
    imu0_config: [false, false, false, # x, y, z position
                  false, false, false, # roll, pitch, yaw (use velocities instead)
                  false, false, false, # x, y, z velocity
                  true,  true,  true,  # roll, pitch, yaw velocity (from gyro)
                  true,  true,  true]  # x, y, z acceleration (from accel)
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    # Create 3 Robot Odometry
    odom0: /wizard/odom
    odom0_config: [true,  true,  false, # x, y position
                   false, false, true,  # yaw orientation
                   true,  true,  false, # x, y velocity
                   false, false, true,  # yaw velocity
                   false, false, false]
    odom0_relative: false